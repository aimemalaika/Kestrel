{{- if .Values.metrics.serviceMonitor.enabled }}
# Requires the Prometheus Operator CRDs (monitoring.coreos.com/v1).
# The metrics port is exposed on the Service only when service.metrics=true;
# this ServiceMonitor targets the named "metrics" port, so set service.metrics=true.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "kestrel.fullname" . }}
  labels:
    {{- include "kestrel.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "kestrel.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      path: {{ .Values.metrics.serviceMonitor.path }}
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
{{- end }}
