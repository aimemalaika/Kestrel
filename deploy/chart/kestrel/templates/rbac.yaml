{{- if .Values.rbac.create }}
# ---------------------------------------------------------------------------
# Kestrel RBAC
#
# This ClusterRole grants CLUSTER-WIDE READ (get/list/watch) on all resources.
#
# WHY SO BROAD:
#   Kestrel authorizes each user REQUEST by FORWARDING that user's own OIDC
#   token to the apiserver (token forwarding, NOT impersonation). However, the
#   shared informer / SSE cache watches the cluster AS THIS SERVICEACCOUNT, so
#   the SA must be able to get/list/watch everything it caches — including
#   Secrets. Per-user delivery over SSE is gated by the read filter (issue #46),
#   which is what prevents cross-user leakage. The SA is deliberately broad-read.
#
# WHAT IS DELIBERATELY ABSENT:
#   - NO `impersonate` (users, groups, serviceaccounts) — Kestrel never impersonates.
#   - NO `serviceaccounts/token` — Kestrel never mints tokens.
#   This is READ-ONLY: only get/list/watch, never create/update/delete.
#
# Set rbac.clusterRead=false to omit the broad grant (most read features break).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kestrel.fullname" . }}
  labels:
    {{- include "kestrel.labels" . | nindent 4 }}
rules:
{{- if .Values.rbac.clusterRead }}
{{- if .Values.rbac.excludeSecrets }}
  # rbac.excludeSecrets=true: the BEHAVIORAL protection is the
  # --no-watch-resources=secrets flag on the Deployment — Kestrel's shared
  # informer never list/watches Secrets, so they are never cached or streamed
  # over SSE. The grant below is still a wildcard and therefore STILL technically
  # allows the SA to read Secrets: Kubernetes RBAC has no "deny" verb, and there
  # is no way to express `resources: ["*"] except secrets` — truly removing
  # Secrets from the SA would require enumerating every resource (infeasible, and
  # it breaks for CRDs). To fully strip Secrets from RBAC, set
  # rbac.clusterRead=false and bind your own narrower Role out-of-band. See the
  # chart README section "Excluding Secrets".
{{- end }}
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
{{- end }}
{{- with .Values.rbac.extraRules }}
  {{- toYaml . | nindent 2 }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kestrel.fullname" . }}
  labels:
    {{- include "kestrel.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kestrel.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kestrel.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
