{{- if .Values.dex.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kestrel.dexFullname" . }}
  labels:
    {{- include "kestrel.labels" . | nindent 4 }}
type: Opaque
stringData:
  client-secret: {{ include "kestrel.dexClientSecret" . | quote }}
  admin-password: {{ include "kestrel.dexAdminPassword" . | quote }}
  {{- with .Values.dex.github.clientSecret }}
  github-client-secret: {{ . | quote }}
  {{- end }}
{{- end }}
