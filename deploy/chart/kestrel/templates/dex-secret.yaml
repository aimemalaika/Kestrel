{{- if .Values.dex.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kestrel.dexFullname" . }}
  labels:
    {{- include "kestrel.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Full Dex config lives in the Secret (not a ConfigMap) so no sensitive value
  # (client secret, admin bcrypt hash) is readable via configmap-get. The GitHub
  # connector still uses $GITHUB_CLIENT_SECRET env expansion (connectors section).
  config.yaml: |
    issuer: {{ include "kestrel.dexIssuer" . }}
    storage:
      type: kubernetes
      config:
        inCluster: true
    web:
      http: 0.0.0.0:5556
    {{- if .Values.dex.admin.enabled }}
    oauth2:
      passwordConnector: local
    {{- end }}
    staticClients:
      - id: {{ .Values.dex.clientId }}
        name: Kestrel
        secret: {{ include "kestrel.dexClientSecret" . | quote }}
        redirectURIs:
          - {{ printf "https://%s/auth/callback" .Values.ingress.host | quote }}
    {{- if .Values.dex.admin.enabled }}
    enablePasswordDB: true
    staticPasswords:
      - email: {{ .Values.dex.admin.user | quote }}
        hash: {{ include "kestrel.dexAdminHash" . | quote }}
        username: {{ .Values.dex.admin.user | quote }}
        userID: {{ printf "%s" .Values.dex.admin.user | sha256sum | trunc 32 | quote }}
    {{- end }}
    {{- if .Values.dex.github.clientId }}
    connectors:
      - type: github
        id: github
        name: GitHub
        config:
          clientID: {{ .Values.dex.github.clientId | quote }}
          clientSecret: "$GITHUB_CLIENT_SECRET"
          redirectURI: {{ printf "%s/callback" (include "kestrel.dexIssuer" .) | quote }}
          {{- with .Values.dex.github.orgs }}
          orgs:
            {{- toYaml . | nindent 12 }}
          {{- end }}
    {{- end }}
  client-secret: {{ include "kestrel.dexClientSecret" . | quote }}
  {{- if .Values.dex.admin.enabled }}
  admin-password: {{ include "kestrel.dexAdminPassword" . | quote }}
  admin-hash: {{ include "kestrel.dexAdminHash" . | quote }}
  {{- end }}
  {{- with .Values.dex.github.clientSecret }}
  github-client-secret: {{ . | quote }}
  {{- end }}
{{- end }}
