{{- if .Values.dex.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kestrel.dexFullname" . }}
  labels:
    {{- include "kestrel.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kestrel.dexFullname" . }}
  labels:
    {{- include "kestrel.labels" . | nindent 4 }}
rules:
  - apiGroups: ["dex.coreos.com"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kestrel.dexFullname" . }}
  labels:
    {{- include "kestrel.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kestrel.dexFullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kestrel.dexFullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
