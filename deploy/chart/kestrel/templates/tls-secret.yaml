{{- if and .Values.ingress.enabled (eq (include "kestrel.ingressTLSMode" .) "selfSigned") }}
{{- $name := include "kestrel.ingressTLSSecretName" . -}}
{{- $host := required "ingress.host is required for a self-signed TLS cert (ingress.tls.mode=selfSigned)" .Values.ingress.host -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kestrel.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
{{- if and $existing $existing.data (index $existing.data "tls.crt") }}
  # Reuse the existing self-signed cert so it is stable across upgrades.
  tls.crt: {{ index $existing.data "tls.crt" }}
  tls.key: {{ index $existing.data "tls.key" }}
{{- else }}
{{- $cert := genSelfSignedCert $host nil (list $host) 3650 }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
{{- end }}
