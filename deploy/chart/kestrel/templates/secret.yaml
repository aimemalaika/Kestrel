{{- if and (not .Values.existingSecret.name) (or .Values.secret.create .Values.dex.enabled) }}
# Chart-managed Secret. When secret.create is set, inline oidc/registry values
# are rendered here (testing only — do NOT commit real secrets to a values
# file; prefer existingSecret for production). A session key is always present:
# a stable generated one when you don't supply secret.sessionKey.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kestrel.fullname" . }}
  labels:
    {{- include "kestrel.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secret.create }}
  {{- with .Values.secret.oidcClientSecret }}
  {{ $.Values.existingSecret.oidcClientSecretKey }}: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.registryPassword }}
  {{ $.Values.existingSecret.registryPasswordKey }}: {{ . | quote }}
  {{- end }}
  {{- end }}
  {{ .Values.existingSecret.sessionKeyKey }}: {{ include "kestrel.sessionKey" . | quote }}
{{- end }}
