{{- if and .Values.secret.create (not .Values.existingSecret.name) }}
# WARNING: inline secret values are rendered into this manifest. This path is a
# convenience for testing only — do NOT commit real secrets to a values file.
# For production, set existingSecret.name and manage the Secret out-of-band.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kestrel.fullname" . }}
  labels:
    {{- include "kestrel.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secret.oidcClientSecret }}
  {{ $.Values.existingSecret.oidcClientSecretKey }}: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.sessionKey }}
  {{ $.Values.existingSecret.sessionKeyKey }}: {{ . | quote }}
  {{- end }}
  {{- with .Values.secret.registryPassword }}
  {{ $.Values.existingSecret.registryPasswordKey }}: {{ . | quote }}
  {{- end }}
{{- end }}
