---
- name: Require kestrel_addon_host
  ansible.builtin.assert:
    that: kestrel_addon_host | length > 0
    fail_msg: "Set kestrel_addon_host to the public ingress/issuer hostname."
  run_once: true
  delegate_to: localhost

- name: Create the local PKI working dir
  ansible.builtin.file:
    path: "{{ kestrel_addon_local_certdir }}"
    state: directory
    mode: "0700"
  run_once: true
  delegate_to: localhost

- name: Generate the CA private key
  community.crypto.openssl_privatekey:
    path: "{{ kestrel_addon_local_certdir }}/ca.key"
    type: RSA
    size: 4096
  run_once: true
  delegate_to: localhost

- name: Generate the CA CSR
  community.crypto.openssl_csr:
    path: "{{ kestrel_addon_local_certdir }}/ca.csr"
    privatekey_path: "{{ kestrel_addon_local_certdir }}/ca.key"
    common_name: "Kestrel Issuer CA"
    basic_constraints:
      - "CA:TRUE"
    basic_constraints_critical: true
    key_usage:
      - keyCertSign
      - cRLSign
    key_usage_critical: true
  run_once: true
  delegate_to: localhost

- name: Self-sign the CA certificate
  community.crypto.x509_certificate:
    path: "{{ kestrel_addon_local_certdir }}/ca.pem"
    csr_path: "{{ kestrel_addon_local_certdir }}/ca.csr"
    privatekey_path: "{{ kestrel_addon_local_certdir }}/ca.key"
    provider: selfsigned
    selfsigned_not_after: "+{{ kestrel_addon_cert_days }}d"
  run_once: true
  delegate_to: localhost

- name: Generate the server private key
  community.crypto.openssl_privatekey:
    path: "{{ kestrel_addon_local_certdir }}/tls.key"
    type: RSA
    size: 2048
  run_once: true
  delegate_to: localhost

- name: Generate the server CSR (SAN = issuer host)
  community.crypto.openssl_csr:
    path: "{{ kestrel_addon_local_certdir }}/tls.csr"
    privatekey_path: "{{ kestrel_addon_local_certdir }}/tls.key"
    common_name: "{{ kestrel_addon_host }}"
    subject_alt_name:
      - "DNS:{{ kestrel_addon_host }}"
  run_once: true
  delegate_to: localhost

- name: Sign the server cert with the CA (ownca)
  community.crypto.x509_certificate:
    path: "{{ kestrel_addon_local_certdir }}/tls.crt"
    csr_path: "{{ kestrel_addon_local_certdir }}/tls.csr"
    provider: ownca
    ownca_path: "{{ kestrel_addon_local_certdir }}/ca.pem"
    ownca_privatekey_path: "{{ kestrel_addon_local_certdir }}/ca.key"
    ownca_not_after: "+{{ kestrel_addon_cert_days }}d"
  run_once: true
  delegate_to: localhost

- name: Copy the issuer CA to control-plane nodes (for kube_oidc_ca_file)
  ansible.builtin.copy:
    src: "{{ kestrel_addon_local_certdir }}/ca.pem"
    dest: "{{ kestrel_addon_apiserver_ca_path }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  tags: [distribute]
